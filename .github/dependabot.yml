version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # Wait a week after a version is published before proposing it: a hijacked or broken
    # release is usually caught and pulled within days. Security updates are not delayed.
    cooldown:
      default-days: 7
    ignore:
      # @types/node must track the lowest Node we support, not the newest. The
      # packages declare engines ">=20" (hook: ">=22.13"); newer majors of the
      # types would let code call Node APIs that do not exist on those runtimes
      # and still type-check. Move this major only when the engines floor moves.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Wait a week after a version is published before proposing it: a hijacked or broken
    # release is usually caught and pulled within days. Security updates are not delayed.
    cooldown:
      default-days: 7
  - package-ecosystem: "cargo"
    directory: "/packages/tray"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # Wait a week after a version is published before proposing it: a hijacked or broken
    # release is usually caught and pulled within days. Security updates are not delayed.
    cooldown:
      default-days: 7
