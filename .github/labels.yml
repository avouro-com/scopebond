# Label set for Scopebond. Apply with a label-sync action or `gh label create`.
# The scope:* labels are set by the scope-review agent (see workflows/scope-review.yml).

- name: "scope:aligned"
  color: "0e8a16"
  description: "Within SCOPE.md; proceed to normal review"
- name: "scope:needs-changes"
  color: "fbca04"
  description: "In scope but must change to meet a constraint/package rule"
- name: "scope:out-of-scope"
  color: "b60205"
  description: "Outside SCOPE.md or expands scope; routed to a maintainer"
- name: "needs-maintainer"
  color: "d93f0b"
  description: "Requires a human maintainer decision"
- name: "needs-triage"
  color: "ededed"
  description: "Not yet triaged"
- name: "bug"
  color: "d73a4a"
  description: "A defect"
- name: "enhancement"
  color: "a2eeef"
  description: "A feature or improvement"
- name: "docs"
  color: "0075ca"
  description: "Documentation"
- name: "question"
  color: "cc317c"
  description: "A question or discussion"
- name: "good first issue"
  color: "7057ff"
  description: "Approachable for newcomers"
