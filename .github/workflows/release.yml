name: Release

# Versioning automation (safe by default — never auto-publishes). On push to main
# with pending changesets, opens/updates a "Version packages" PR that bumps versions
# and writes changelogs. With no changesets, this is a clean no-op.
#
# PUBLISHING is a deliberate step, kept off CI so nothing (especially 0.0.0) is ever
# auto-published. When you're ready to publish (see RELEASING.md): merge the Version
# PR, then either run `pnpm release` locally, or add a `publish: pnpm release` input
# to the step below (with NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}) to enable
# publish-on-merge. Publishing needs the NPM_TOKEN secret.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The repository currently disallows Actions' default token from
          # creating pull requests. Reuse the existing company automation PAT
          # when configured, while retaining github.token for forks/dev copies.
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN || github.token }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Configure company commit identity
        run: |
          git config user.name "avourohq"
          git config user.email "founder@avouro.com"
      - uses: changesets/action@v1
        with:
          github-token: ${{ secrets.PERSONAL_ACCESS_TOKEN || github.token }}
          setupGitUser: false
          version: pnpm version:packages
          commit: "chore: version packages"
          title: "Version packages"
