name: CI

on:
  # main requires an up-to-date branch (strict required checks), so the pull-request
  # (or merge-queue) run already tested the exact tree that lands; a stack lands by
  # merging its top PR with a merge commit. A second run on push to main only
  # re-bills the same minutes; workflow_dispatch is the manual way to re-verify main.
  pull_request:
    branches: [main]
  # Merge queue: queued PRs are tested together once, on the exact tree that lands.
  merge_group: {}
  workflow_dispatch: {}

# A newer push to the same pull request supersedes the run in flight (the
# install matrix is six jobs, so cancelling stale runs is the largest saving).
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    # The required status check is named "test"; keep this name.
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build + test (tsc build, then node --test)
        run: pnpm -r test
      - name: Check published release metadata
        run: pnpm run check:release-state
      - name: Pack and install gateway as a consumer
        run: pnpm run test:package
      - name: Run examples as a smoke (decisions asserted)
        run: pnpm run test:examples
      - name: Test repo scripts (scope-review sanitizer, etc.)
        run: pnpm run test:scripts

  # The hook's path, case and shell handling is Windows-sensitive (backslash paths,
  # case-insensitive names, PowerShell), so the full unit suites run there too. Run one
  # after another they took about six minutes, four of them the hook's, so the hook's
  # suite runs as two halves beside one job for every other package.
  test-windows:
    name: "test-windows (${{ matrix.part }})"
    strategy:
      fail-fast: false
      matrix:
        part: [hook-1, hook-2, packages]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build all packages (each suite needs its workspace dependencies built)
        run: pnpm -r build
      - name: Hook tests, half ${{ matrix.part == 'hook-1' && '1' || '2' }} of 2
        if: matrix.part != 'packages'
        working-directory: packages/hook
        env:
          SHARD: ${{ matrix.part == 'hook-1' && '1/2' || '2/2' }}
        run: node --test --test-timeout=300000 "--test-shard=$env:SHARD" test/*.test.mjs test/*.test.js
      - name: Every other package (tsc build, then node --test)
        if: matrix.part == 'packages'
        run: pnpm -r --filter "!@scopebond/hook" test
        # The Windows journeys run in their own jobs below, in parallel.
        env:
          SCOPEBOND_WINDOWS_JOURNEY: "0"

  # macOS: the hook's and the Scopebond Agent's unit suites (case-insensitive file system, /private temp paths, launchd).
  # The install smoke already runs on macOS in the install matrix below.
  test-macos:
    name: test-macos
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build all packages (the hook's and agent's tsc need their workspace deps' types)
        run: pnpm -r build
      - name: Hook and agent tests
        run: pnpm --filter @scopebond/hook --filter @scopebond/agent test
      # The macOS single executable: it must carry a signature (Apple silicon kills unsigned code) and decide as the hook.
      - name: Build and run the single executable
        run: node --test packages/native/test/sea.test.mjs
        env:
          SCOPEBOND_SEA: "1"

  # The clean-machine Windows journey (powershell.exe, pwsh.exe, a standard user), one job each,
  # in parallel with everything else. It packs the hook and agent itself.
  windows-journey:
    name: "windows journey (${{ matrix.run }})"
    strategy:
      fail-fast: false
      matrix:
        include:
          - run: powershell
            pattern: "passes in powershell\\.exe"
          - run: pwsh
            pattern: "passes in pwsh\\.exe"
          - run: standard-user
            pattern: "standard \\(non-administrator\\) user"
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - name: Journey (${{ matrix.run }})
        run: node --test --test-name-pattern "$env:JOURNEY_PATTERN" packages/hook/test/windows-journey.run.mjs
        shell: pwsh
        env:
          SCOPEBOND_WINDOWS_JOURNEY: "1"
          JOURNEY_PATTERN: ${{ matrix.pattern }}

  # The single executable (agent + hook in one file, packages/native): built from this tree, it must decide
  # Claude Code calls exactly as the npm hook does, and start quickly. Unsigned here; signing is the release workflow's.
  single-executable:
    name: "single executable (windows)"
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - name: Build and run the single executable
        run: node --test packages/native/test/sea.test.mjs
        env:
          SCOPEBOND_SEA: "1"
      # The installer (WiX 5, a local dotnet tool): silent install and removal per user and for every user, on this
      # throwaway runner only.
      - name: Install and remove the MSI
        run: node --test packages/native/test/msi.test.mjs
        env:
          SCOPEBOND_MSI: "1"

  install-matrix:
    name: "install (${{ matrix.os }}, node ${{ matrix.node }})"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build all packages (the hook's tsc needs its workspace deps' types)
        run: pnpm -r build
      - name: Pack the hook with pnpm (rewrites workspace deps to published versions)
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/pack"
          cd packages/hook
          pnpm pack --pack-destination "$RUNNER_TEMP/pack"
      # The script installs the tarball this job packed with `npm i -g`, as a user would, then drives it.
      - name: Install the packed tarball globally and drive the real install
        shell: bash
        run: SCOPEBOND_PACK_DIR="$RUNNER_TEMP/pack" node packages/hook/test/install-matrix.mjs

  # One check for every platform job, so branch protection can require them all by one name: it fails unless every
  # Windows, macOS and install job passed. Until it is required, the merge queue waits only for `test`.
  platforms:
    name: platforms
    if: always()
    needs: [test-windows, test-macos, windows-journey, single-executable, install-matrix]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every platform job to have passed
        shell: bash
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for result in $RESULTS; do test "$result" = success; done
