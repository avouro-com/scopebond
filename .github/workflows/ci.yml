name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build + test (tsc build, then node --test)
        run: pnpm -r test
      - name: Check published release metadata
        run: pnpm run check:release-state
      - name: Pack and install gateway as a consumer
        run: pnpm run test:package
      - name: Run examples as a smoke (decisions asserted)
        run: pnpm run test:examples

  install-matrix:
    name: install (${{ matrix.os }} · node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the hook
        run: pnpm --filter @scopebond/hook build
      - name: Pack the hook (pnpm rewrites workspace: deps to published versions)
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/pack"
          pnpm --filter @scopebond/hook pack --pack-destination "$RUNNER_TEMP/pack"
      - name: Install the packed tarball globally and drive the real install
        shell: bash
        run: |
          TARBALL=$(ls "$RUNNER_TEMP/pack"/*.tgz | head -1)
          npm i -g "$TARBALL"
          ROOT=$(npm root -g)
          SCOPEBOND_CLI="$ROOT/@scopebond/hook/dist/cli.js" node packages/hook/test/install-matrix.mjs
