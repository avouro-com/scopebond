name: CI

on:
  # main requires an up-to-date branch (strict required checks) and squash-only
  # merges, so the pull-request run already tested the exact tree that lands. A
  # second run on push to main only re-bills the same minutes; workflow_dispatch
  # is the manual way to re-verify main.
  pull_request:
    branches: [main]
  workflow_dispatch: {}

# A newer push to the same pull request supersedes the run in flight (the
# install matrix is six jobs, so cancelling stale runs is the largest saving).
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build + test (tsc build, then node --test)
        run: pnpm -r test
      - name: Check published release metadata
        run: pnpm run check:release-state
      - name: Pack and install gateway as a consumer
        run: pnpm run test:package
      - name: Run examples as a smoke (decisions asserted)
        run: pnpm run test:examples
      - name: Test repo scripts (scope-review sanitizer, etc.)
        run: pnpm run test:scripts

  # The hook's path, case and shell handling is Windows-sensitive (backslash paths,
  # case-insensitive names, PowerShell), so the full unit suites run there too.
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build + test (tsc build, then node --test)
        run: pnpm -r test

  install-matrix:
    name: "install (${{ matrix.os }}, node ${{ matrix.node }})"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build all packages (the hook's tsc needs its workspace deps' types)
        run: pnpm -r build
      - name: Pack the hook with pnpm (rewrites workspace deps to published versions)
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/pack"
          cd packages/hook
          pnpm pack --pack-destination "$RUNNER_TEMP/pack"
      - name: Install the packed tarball globally and drive the real install
        shell: bash
        run: |
          TARBALL=$(ls "$RUNNER_TEMP/pack"/*.tgz | head -1)
          npm i -g "$TARBALL"
          ROOT=$(npm root -g)
          SCOPEBOND_CLI="$ROOT/@scopebond/hook/dist/cli.js" node packages/hook/test/install-matrix.mjs
