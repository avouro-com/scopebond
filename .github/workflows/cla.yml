name: CLA

# Requires every contributor to sign the CLA (CLA.md) before their PR can merge.
# Signatures are recorded in a file in this repo on a dedicated branch.
#
# SETUP:
#   1. Create a repo (or org) secret PERSONAL_ACCESS_TOKEN with `repo` scope
#      (a fine-grained token with contents:write is fine). Needed to store signatures.
#   2. Make "CLA Assistant" a required status check in branch protection for main.
# Until PERSONAL_ACCESS_TOKEN is set, this no-ops.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    env:
      PAT: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
    steps:
      - id: gate
        run: echo "enabled=${{ env.PAT != '' }}" >> "$GITHUB_OUTPUT"
      - if: steps.gate.outputs.enabled == 'true'
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        with:
          path-to-signatures: ".github/cla/signatures.json"
          path-to-document: "https://github.com/avouro-com/scopebond/blob/main/CLA.md"
          branch: "cla-signatures"
          allowlist: "dependabot[bot]"
          custom-notsigned-prcomment: "Thanks for the PR! Before we can merge, please sign the CLA by commenting below with the exact sentence in CLA.md."
