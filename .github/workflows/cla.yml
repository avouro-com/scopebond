name: CLA

# Every outside contributor signs the CLA (CLA.md) in the pull request description:
# by ticking the template's "I agree to the CLA" box, or with the signing sentence.
# Editing the description re-runs this check. Maintainers and the dependency bots pass.
#
# Security: runs on `pull_request` with a read-only token and no secrets. The check
# script comes from the base commit, never from the pull request.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

# A newer edit or push supersedes the check still in flight.
concurrency:
  group: cla-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  cla:
    name: CLA
    runs-on: ubuntu-latest
    permissions:
      contents: read # check out the check script from the base commit
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          sparse-checkout: scripts/cla-check.mjs
          sparse-checkout-cone-mode: false
      - name: Check the pull request author signed the CLA
        run: |
          # A pull request based on a commit from before this check existed has nothing to run.
          if [ ! -f scripts/cla-check.mjs ]; then echo "The base commit has no CLA check yet."; exit 0; fi
          node scripts/cla-check.mjs
