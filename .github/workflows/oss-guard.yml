name: OSS Guard

# The hard gate for merges. Make this a REQUIRED status check in branch
# protection for `main` so no pull request can merge unless it passes.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  guard:
    name: content + secret gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.20.0
      - name: Run OSS content & secret gate
        run: node scripts/oss-gate.mjs --tree
      - name: Scan PR commit messages (attribution / private / secrets)
        if: github.event_name == 'pull_request'
        run: node scripts/oss-gate.mjs --messages-range "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
      - name: Enforce core-package dependency boundary (ADR-008)
        run: node scripts/deps-allowlist.mjs
