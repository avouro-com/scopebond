name: OSS Guard

# The hard gate for merges. Make this a REQUIRED status check in branch
# protection for `main` so no pull request can merge unless it passes.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  guard:
    name: content + secret gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.20.0
      - name: Run OSS content & secret gate
        run: node scripts/oss-gate.mjs --tree
      - name: Enforce core-package dependency boundary (ADR-008)
        run: node scripts/deps-allowlist.mjs
