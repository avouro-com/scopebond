name: OSS Guard

# The hard gate for merges. Make this a REQUIRED status check in branch
# protection for `main` so no pull request can merge unless it passes.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Required check: it must also run for the merge queue, or queued PRs never merge.
  merge_group: {}
  # The release workflow dispatches it on the Version packages branch, whose pull
  # request (opened with the workflow's own token) starts no runs by itself.
  workflow_dispatch: {}

# A newer push to the same pull request supersedes the run in flight; runs on
# main (the defense-in-depth tree scan) are never cancelled.
concurrency:
  group: oss-guard-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  guard:
    name: content + secret gate
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.20.0
      - name: Run OSS content & secret gate
        run: node scripts/oss-gate.mjs --tree
      - name: Scan PR commit messages (attribution / private / secrets)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/oss-gate.mjs --messages-range "$BASE_SHA..$HEAD_SHA"
      - name: Scan the branch's commit messages (dispatched run)
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        run: node scripts/oss-gate.mjs --messages-range "origin/main..HEAD"
      - name: Enforce core-package dependency boundary (ADR-008)
        run: node scripts/deps-allowlist.mjs
