name: Issue Triage (agent)

# Automated first-pass triage of new issues against SCOPE.md: verdict comment +
# labels; routes scope-expanding issues to a maintainer. Uses whichever LLM key is
# set (ANTHROPIC_API_KEY or DEEPSEEK_TOKEN); no-ops if neither is set.
#
# The LLM keys are read only in the `agent-review` environment's jobs. The script
# runs from this repository's default branch (the `issues` event never carries code).

on:
  issues:
    types: [opened, reopened]

permissions: {}

# One triage per issue at a time; a reopen supersedes a run still in flight.
concurrency:
  group: issue-triage-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  triage:
    name: triage
    runs-on: ubuntu-latest
    environment:
      name: agent-review
      deployment: false
    permissions:
      contents: read # check out SCOPE.md and the review script
      issues: write # post the verdict comment and apply its labels
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - id: gate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DEEPSEEK_TOKEN: ${{ secrets.DEEPSEEK_TOKEN }}
        run: |
          if [ -n "${ANTHROPIC_API_KEY}${DEEPSEEK_TOKEN}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.gate.outputs.enabled == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: steps.gate.outputs.enabled == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22 }
      - if: steps.gate.outputs.enabled == 'true'
        run: node scripts/agent-review.mjs issue
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DEEPSEEK_TOKEN: ${{ secrets.DEEPSEEK_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
