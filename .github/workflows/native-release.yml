name: Native release (signed)

# The signed single executable (packages/native) and the native tray (packages/tray), built from this public source:
#   build      the executable, the tray and their SBOM from main, with no secrets (any fork can run this job and gets
#              unsigned files)
#   sign       Azure Artifact Signing of the executable and the tray through GitHub's OIDC token, only in the protected
#              `signing` environment (approval required; protected branches only); nothing else runs there
#   installer  the installer built around the signed programs (WiX), with no secrets and no OIDC token
#   sign-installer  the installer signed (the `signing` environment again), then every file verified, summed, the
#              release manifest signed (required) and everything attested
#   build-macos  the macOS executable and installer package, for Apple silicon and Intel, with no secrets (unsigned; the
#              package is installed and removed on the runner)
#   sign-macos the Apple signing of what build-macos built (Developer ID + notarization): the executable, and the
#              installer package signed with the Developer ID Installer identity, notarized and stapled; off until its
#              secrets exist
#   defender-scan  the signed files scanned by Microsoft Defender on current definitions; a detection stops the release
#   release    a draft GitHub release with the signed files, for a person to check and publish
#
# The build job also builds the engine bundle (hook-bundle.mjs: the hook as one file, for signed installs to update their
# engine without a new installer); sign-installer signs its manifest with the updater key, and the release carries it.
#
# Started on main by the release workflow (release.yml) once it has published a new @scopebond/agent, with that version,
# so the signed build follows each npm release; or by hand from main: Actions → Native release (signed) → Run workflow.
# Either way both signing environments still wait for an owner's approval, and the release stays a draft pre-release for
# a person to check and publish.
#
# A pull request that touches this workflow or the release-only tooling in packages/native (version stamping, SBOM,
# icon, manifests, the installer definitions) runs the `build` and `build-macos` jobs alone (no secrets, no `signing`):
# a step that would break the release fails on the pull request instead. Other changes to packages/native and packages/tray are built and
# run on every pull request by ci.yml (single executable, MSI) and tray.yml (the tray's release build), so this build
# would only repeat them.

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Create a draft GitHub release with the signed files"
        type: boolean
        default: true
      # The release workflow passes the @scopebond/agent version it has just published; the build fails when the
      # commit it builds says otherwise. Empty for a run by hand: the version on main.
      version:
        description: "The agent version this build must be (empty: whatever packages/agent says)"
        type: string
        required: false
        default: ""
  pull_request:
    paths:
      - .github/workflows/native-release.yml
      - packages/native/package.json
      - packages/native/stamp.mjs
      - packages/native/sbom.mjs
      - packages/native/icon.mjs
      - packages/native/manifest.mjs
      - packages/native/hook-bundle.mjs
      - packages/native/src/hook-bundle-main.mjs
      - packages/native/winget.mjs
      - packages/native/updater-key.mjs
      - packages/native/updater-public-key.txt
      - packages/native/verify-signed.ps1
      - packages/native/defender-scan.ps1
      - packages/native/wix/**
      - packages/native/build-pkg.mjs
      - packages/native/version.mjs
      - packages/native/macos/**
      - packages/native/test/pkg.test.mjs

permissions: {}

concurrency:
  # One release at a time from main; a pull request's build is its own group, replaced by the next push.
  group: native-release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build (windows)
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      # No dependency cache: a release build starts from the lockfile alone.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.20.0
      # The version first: a run started for a version this commit does not carry stops before building anything.
      - id: version
        name: Version
        shell: pwsh
        env:
          WANTED: ${{ inputs.version }}
        run: |
          $v = (Get-Content packages/agent/package.json | ConvertFrom-Json).version
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "packages/agent/package.json has no release version: $v" }
          if ($env:WANTED -and $env:WANTED -ne $v) { throw "asked to build the agent $env:WANTED, but this commit's packages/agent is $v" }
          "version=$v" >> $env:GITHUB_OUTPUT
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      # Built, then stamped with the release's version, names and icon (stamp.mjs), all before the sign job signs it.
      - name: Build the single executable
        run: node packages/native/build-sea.mjs
      - name: Check it runs
        shell: pwsh
        run: |
          $exe = "packages/native/build/scopebond-agent.exe"
          # Read all of the output first: `| Select-Object -First 1` stops the program after one line, and its exit code
          # is then -1 however it ran.
          $out = & $exe hook help
          if ($LASTEXITCODE -ne 0) { throw "the executable did not run (exit $LASTEXITCODE)" }
          $out | Select-Object -First 1
      # The engine bundle (hook-bundle.mjs): the hook as one file in an archive, with a manifest naming this commit. The
      # agent puts a newer one in place on signed installs without a new installer; its manifest is signed in
      # sign-installer, with the updater key, like the release manifest.
      - name: Build the engine bundle
        shell: pwsh
        env:
          COMMIT: ${{ github.sha }}
        run: node packages/native/hook-bundle.mjs build packages/native/dist/hook-bundle "$env:COMMIT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-hook-bundle
          path: |
            packages/native/dist/hook-bundle/scopebond-hook-bundle-*.tgz
            packages/native/dist/hook-bundle/scopebond-hook-bundle-*.manifest.json
          if-no-files-found: error
          retention-days: 7
      # The native tray (Rust, Tauri 2), from its committed Cargo.lock, with no cache: a release build starts from the
      # lockfile alone.
      - name: Rust toolchain (packages/tray/rust-toolchain.toml)
        working-directory: packages/tray
        shell: pwsh
        run: |
          rustup toolchain install
          if ($LASTEXITCODE -ne 0) { rustup show }
          rustc --version
      - name: Build the tray
        working-directory: packages/tray
        run: cargo build --release --locked
      # The tray's own build says 0.1.0; it carries the release's version too, so an upgrade replaces it. Stamped here,
      # before the sign job signs it.
      - name: Put the tray beside the executable, with the release's version
        shell: pwsh
        run: |
          Copy-Item packages/tray/target/release/scopebond-tray.exe packages/native/build/scopebond-tray.exe
          node packages/native/stamp.mjs packages/native/build/scopebond-tray.exe tray
          if ($LASTEXITCODE -ne 0) { throw "stamping the tray failed (exit $LASTEXITCODE)" }
      - name: Both programs carry the release's version and names
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          foreach ($pair in @(@('scopebond-agent.exe', 'Scopebond Agent'), @('scopebond-tray.exe', 'Scopebond tray'))) {
            $info = (Get-Item "packages/native/build/$($pair[0])").VersionInfo
            "$($pair[0]): $($info.FileDescription) $($info.FileVersion) ($($info.CompanyName), $($info.OriginalFilename))"
            if ($info.FileVersion -ne "$env:VERSION.0" -or $info.ProductVersion -ne "$env:VERSION.0") { throw "$($pair[0]) is version $($info.FileVersion), not $env:VERSION.0" }
            if ($info.FileDescription -ne $pair[1] -or $info.CompanyName -ne 'Avouro LLC' -or $info.OriginalFilename -ne $pair[0]) { throw "$($pair[0]) does not name itself" }
          }
      - name: Microsoft Defender finds nothing in the programs
        shell: pwsh
        run: ./packages/native/defender-scan.ps1 packages/native/build/scopebond-agent.exe packages/native/build/scopebond-tray.exe
      - name: SBOM
        run: node packages/native/sbom.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-windows
          path: |
            packages/native/build/scopebond-agent.exe
            packages/native/build/scopebond-tray.exe
            packages/native/build/scopebond-agent.cdx.json
            packages/native/build/sea-main.cjs.map
          if-no-files-found: error
          retention-days: 7

  # Signing the programs: nothing runs here but the download, the Azure sign-in and the signing action. No dependency is
  # installed and no build tool runs in a job that can ask for the signing token.
  sign:
    name: sign (windows)
    needs: build
    # Never from a fork or another branch: the environment allows protected branches only, and this says so too.
    if: github.repository == 'avouro-com/scopebond' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    environment: signing
    permissions:
      contents: read # the build job's artifact
      id-token: write # sign in to Azure (Artifact Signing)
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unsigned-windows
          path: out
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Sign the executable and the tray with Artifact Signing (timestamped)
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          # No cache: the action would otherwise restore its PowerShell module, build tools and signing client from the
          # run's cache, which the build job (dependency install scripts, cargo build) can write.
          cache-dependencies: false
          files-folder: out
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: Scopebond Agent
          description-url: https://github.com/avouro-com/scopebond
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-programs
          path: out
          if-no-files-found: error
          retention-days: 7

  # The installer, built around the signed executable and the signed tray, in a job with no secrets and no OIDC token:
  # `dotnet tool restore`, the WiX extension and `wix build` are third-party code, and never run where a signing token
  # can be asked for.
  installer:
    name: installer (windows)
    needs: sign
    runs-on: windows-latest
    permissions:
      contents: read # check out the source the installer is built from
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.20.0
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed-programs
          path: out
      - name: The programs are signed by Avouro LLC
        shell: pwsh
        run: ./packages/native/verify-signed.ps1 -Folder out
      - name: Build the installer (WiX 5)
        shell: pwsh
        run: |
          node packages/native/build-msi.mjs out/scopebond-agent.exe out/scopebond-tray.exe
          New-Item -ItemType Directory -Force msi | Out-Null
          Move-Item packages/native/build/scopebond-agent-*-x64.msi msi/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-installer
          path: msi
          if-no-files-found: error
          retention-days: 7

  # Signing the installer, then everything a release carries: verified, summed, the signed manifest, winget, attested.
  sign-installer:
    name: sign installer (windows)
    # The signed macOS files, once Apple signing is on, go into the same SHA256SUMS and signed release manifest (the
    # macOS updater installs a package only when that manifest names it); until then sign-macos is skipped.
    needs: [build, installer, sign-macos]
    if: >-
      !cancelled() && github.repository == 'avouro-com/scopebond' && github.ref == 'refs/heads/main'
      && needs.build.result == 'success' && needs.installer.result == 'success'
      && (needs.sign-macos.result == 'success' || needs.sign-macos.result == 'skipped')
    runs-on: windows-latest
    environment: signing
    permissions:
      contents: read # check out the release scripts
      id-token: write # sign in to Azure (Artifact Signing) and sign the provenance attestation
      attestations: write # record the build provenance attestation
    steps:
      # The source, for the release scripts (no dependencies are installed here).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.20.0
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed-programs
          path: out
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unsigned-installer
          path: msi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unsigned-hook-bundle
          path: out
      - if: needs.sign-macos.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: signed-macos-*
          merge-multiple: true
          path: out
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Sign the installer with Artifact Signing (timestamped)
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          cache-dependencies: false # nothing restored from the run's cache (see the sign job)
          files-folder: msi
          files-folder-filter: msi
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: Scopebond Agent
          description-url: https://github.com/avouro-com/scopebond
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true
      - name: Put the installer with the other files, and name the executables by the release's version
        shell: pwsh
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          Move-Item msi/*.msi out/
          Move-Item out/scopebond-agent.exe "out/scopebond-agent-$env:VERSION-x64.exe"
          Move-Item out/scopebond-tray.exe "out/scopebond-tray-$env:VERSION-x64.exe"
      # signtool verify /pa, a valid signature with a timestamp, and the publisher by the updater's own anchored rule.
      - name: Verify every signature, its timestamp and the publisher
        shell: pwsh
        run: ./packages/native/verify-signed.ps1 -Folder out -SignTool
      # The updater key signs in the seal job below, which runs nothing but the repository's own release scripts.
      # The winget manifests (Avouro.Scopebond) for this release's installer; the owner submits them to winget-pkgs.
      - name: winget manifests
        shell: pwsh
        env:
          VERSION: ${{ needs.build.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          $msi = Get-ChildItem out -Filter "scopebond-agent-$env:VERSION-x64.msi" | Select-Object -First 1
          $wi = New-Object -ComObject WindowsInstaller.Installer
          $db = $wi.GetType().InvokeMember('OpenDatabase', 'InvokeMethod', $null, $wi, @($msi.FullName, 0))
          $view = $db.GetType().InvokeMember('OpenView', 'InvokeMethod', $null, $db, @("SELECT ``Value`` FROM ``Property`` WHERE ``Property``='ProductCode'"))
          $view.GetType().InvokeMember('Execute', 'InvokeMethod', $null, $view, $null) | Out-Null
          $record = $view.GetType().InvokeMember('Fetch', 'InvokeMethod', $null, $view, $null)
          $code = $record.GetType().InvokeMember('StringData', 'GetProperty', $null, $record, 1)
          $sha = (Get-FileHash $msi.FullName -Algorithm SHA256).Hash
          $url = "https://github.com/$env:REPO/releases/download/agent-native-v$env:VERSION/$($msi.Name)"
          node packages/native/winget.mjs $env:VERSION $url $sha $code out
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            out/scopebond-agent-*-x64.exe
            out/scopebond-tray-*-x64.exe
            out/scopebond-agent-*-x64.msi
            out/scopebond-hook-bundle-*.tgz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-windows-unsealed
          path: out
          if-no-files-found: error
          retention-days: 7

  # The updater key's two signatures, in a job of its own: checkout, Node and the repository's release scripts (Node's
  # built-ins only), no dependency install, no cache, no Azure sign-in and no OIDC token. The engine bundle's manifest is
  # signed first (the scripts check the archive's digest and this commit), then the sums, then the release manifest that
  # signed installs trust before updating themselves. Without the key the run fails: a release without it is one signed
  # installs would never update to. The manifest names the commit it was built from, so a release is bound to one tree.
  seal:
    name: seal (updater key)
    needs: [build, sign-installer]
    if: >-
      !cancelled() && github.repository == 'avouro-com/scopebond' && github.ref == 'refs/heads/main'
      && needs.build.result == 'success' && needs.sign-installer.result == 'success'
    runs-on: ubuntu-latest
    environment: signing
    permissions:
      contents: read # check out the release scripts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.20.0
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed-windows-unsealed
          path: out
      - name: Signed engine bundle manifest
        env:
          UPDATER_SIGNING_KEY: ${{ secrets.UPDATER_SIGNING_KEY }}
          COMMIT: ${{ github.sha }}
        run: node packages/native/hook-bundle.mjs sign out "$COMMIT"
      - name: SHA-256 sums
        run: |
          set -euo pipefail
          cd out
          find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\n' | LC_ALL=C sort | xargs -d '\n' sha256sum > SHA256SUMS
          cat SHA256SUMS
      - name: Signed release manifest
        env:
          UPDATER_SIGNING_KEY: ${{ secrets.UPDATER_SIGNING_KEY }}
          VERSION: ${{ needs.build.outputs.version }}
          COMMIT: ${{ github.sha }}
        run: node packages/native/manifest.mjs "$VERSION" out "$COMMIT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-windows
          path: out
          if-no-files-found: error
          retention-days: 30

  # The macOS build, for Apple silicon and Intel, with no secrets (any fork can run this job and gets unsigned files, as
  # from the Windows build job): the single executable (ad-hoc signed, as Apple silicon requires), and the installer
  # package around it (build-pkg.mjs), installed and removed again on the throwaway runner (test/pkg.test.mjs).
  build-macos:
    name: build (macos ${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - arch: arm64
            runner: macos-latest
          - arch: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      # No dependency cache: a release build starts from the lockfile alone.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.20.0
      - name: Version
        env:
          WANTED: ${{ inputs.version }}
        run: |
          set -euo pipefail
          v="$(node -p 'require("./packages/agent/package.json").version')"
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "packages/agent/package.json has no release version: $v" >&2; exit 1; }
          if [ -n "$WANTED" ] && [ "$WANTED" != "$v" ]; then echo "asked to build the agent $WANTED, but this commit's packages/agent is $v" >&2; exit 1; fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - name: Build the single executable
        run: node packages/native/build-sea.mjs
      - name: It is for this architecture, signed ad hoc, and runs
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          exe=packages/native/build/scopebond-agent
          test "$(lipo -archs "$exe")" = "$ARCH"
          codesign --verify --strict "$exe"
          "$exe" --version
      # The menu-bar app (packages/tray), from its committed Cargo.lock, with no cache: a release build starts from the
      # lockfile alone. Built after the executable (build-sea.mjs empties packages/native/build).
      - name: Rust toolchain (packages/tray/rust-toolchain.toml)
        working-directory: packages/tray
        run: |
          rustup toolchain install || rustup show
          rustc --version
      - name: Build the menu-bar app
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          (cd packages/tray && cargo build --release --locked)
          test "$(lipo -archs packages/tray/target/release/scopebond-tray)" = "$ARCH"
          node packages/native/build-pkg.mjs app packages/tray/target/release/scopebond-tray
          codesign --verify --strict packages/native/build/Scopebond.app
      - name: Build, install and remove the installer package (with the menu-bar app)
        run: node --test packages/native/test/pkg.test.mjs
        env:
          SCOPEBOND_PKG: "1"
          SCOPEBOND_PKG_INSTALL: "1"
          SCOPEBOND_TRAY_APP: ${{ github.workspace }}/packages/native/build/Scopebond.app
      # An artifact keeps no file modes or links: the app travels as a zip that ditto made.
      - run: ditto -c -k --keepParent packages/native/build/Scopebond.app packages/native/build/Scopebond.app.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-macos-${{ matrix.arch }}
          path: |
            packages/native/build/scopebond-agent
            packages/native/build/Scopebond.app.zip
            packages/native/build/scopebond-agent-*.pkg
          if-no-files-found: error
          retention-days: 7

  # The Apple signing of what build-macos built: the executable signed with the Developer ID (hardened runtime) and
  # notarized, then the installer package built around it again, signed with the Developer ID Installer identity,
  # notarized and stapled. Nothing is installed here: no dependency and no build tool, only Apple's own tools and the
  # package script with Node. Off until the owner adds the Apple secrets to the `signing-apple` environment and sets
  # APPLE_SIGNING_ENABLED.
  sign-macos:
    name: sign (macos ${{ matrix.arch }})
    needs: build-macos
    if: github.repository == 'avouro-com/scopebond' && github.ref == 'refs/heads/main' && vars.APPLE_SIGNING_ENABLED == 'true'
    strategy:
      matrix:
        include:
          - arch: arm64
            runner: macos-latest
          - arch: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    environment: signing-apple
    permissions:
      contents: read # check out the package script the installer is built with
      id-token: write # sign the provenance attestation
      attestations: write # record the build provenance attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: |
            packages/agent/package.json
            packages/native/build-pkg.mjs
            packages/native/version.mjs
            packages/native/icon.mjs
            packages/native/macos
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.20.0
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unsigned-macos-${{ matrix.arch }}
          path: packages/native/build
      - name: Sign (Developer ID, hardened runtime) and notarize the executable
        env:
          ARCH: ${{ matrix.arch }}
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
          APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
          APPLE_NOTARY_KEY_ID: ${{ vars.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER: ${{ vars.APPLE_NOTARY_ISSUER }}
        run: |
          set -euo pipefail
          exe=packages/native/build/scopebond-agent
          # An artifact keeps no file modes; the unsigned package from the build job is replaced below.
          chmod 755 "$exe"
          rm -f packages/native/build/scopebond-agent-*.pkg
          test "$(lipo -archs "$exe")" = "$ARCH"
          keychain="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p "" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "" "$keychain"
          echo "$APPLE_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security list-keychains -d user -s "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$keychain"
          cat > "$RUNNER_TEMP/entitlements.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>com.apple.security.cs.allow-jit</key><true/>
            <key>com.apple.security.cs.allow-unsigned-executable-memory</key><true/>
          </dict></plist>
          PLIST
          codesign --force --sign "$APPLE_SIGNING_IDENTITY" --options runtime --timestamp --entitlements "$RUNNER_TEMP/entitlements.plist" "$exe"
          codesign --verify --strict --verbose=2 "$exe"
          "$exe" --version
          # The menu-bar app: Developer ID, hardened runtime (its web view runs in the system's own processes, so it
          # needs no JIT entitlement).
          ditto -x -k packages/native/build/Scopebond.app.zip packages/native/build
          codesign --force --sign "$APPLE_SIGNING_IDENTITY" --options runtime --timestamp packages/native/build/Scopebond.app
          codesign --verify --strict --verbose=2 packages/native/build/Scopebond.app
          ditto -c -k --keepParent "$exe" "scopebond-agent-macos-$ARCH.zip"
          echo "$APPLE_NOTARY_KEY" > "$RUNNER_TEMP/notary.p8"
          xcrun notarytool submit "scopebond-agent-macos-$ARCH.zip" --key "$RUNNER_TEMP/notary.p8" --key-id "$APPLE_NOTARY_KEY_ID" --issuer "$APPLE_NOTARY_ISSUER" --wait
      # The installer package around the signed executable: signed by the Developer ID Installer identity (a certificate
      # of its own, in the same keychain), notarized, and the ticket stapled so Gatekeeper accepts it offline.
      - name: Build, sign, notarize and staple the installer package
        env:
          APPLE_INSTALLER_CERTIFICATE_P12: ${{ secrets.APPLE_INSTALLER_CERTIFICATE_P12 }}
          APPLE_INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_INSTALLER_CERTIFICATE_PASSWORD }}
          APPLE_INSTALLER_IDENTITY: ${{ vars.APPLE_INSTALLER_IDENTITY }}
          APPLE_NOTARY_KEY_ID: ${{ vars.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER: ${{ vars.APPLE_NOTARY_ISSUER }}
        run: |
          set -euo pipefail
          test -n "$APPLE_INSTALLER_IDENTITY" || { echo "APPLE_INSTALLER_IDENTITY is not set: the package would be unsigned" >&2; exit 1; }
          keychain="$RUNNER_TEMP/signing.keychain-db"
          echo "$APPLE_INSTALLER_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/installer.p12"
          security import "$RUNNER_TEMP/installer.p12" -k "$keychain" -P "$APPLE_INSTALLER_CERTIFICATE_PASSWORD" -T /usr/bin/productbuild -T /usr/bin/productsign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$keychain"
          SCOPEBOND_TRAY_APP="$PWD/packages/native/build/Scopebond.app" node packages/native/build-pkg.mjs packages/native/build/scopebond-agent
          pkg="$(ls packages/native/build/scopebond-agent-*.pkg)"
          pkgutil --check-signature "$pkg"
          xcrun notarytool submit "$pkg" --key "$RUNNER_TEMP/notary.p8" --key-id "$APPLE_NOTARY_KEY_ID" --issuer "$APPLE_NOTARY_ISSUER" --wait
          xcrun stapler staple "$pkg"
          xcrun stapler validate "$pkg"
          spctl --assess --type install --verbose=2 "$pkg"
          cp "$pkg" .
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            scopebond-agent-macos-${{ matrix.arch }}.zip
            scopebond-agent-*.pkg
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-macos-${{ matrix.arch }}
          path: |
            scopebond-agent-macos-${{ matrix.arch }}.zip
            scopebond-agent-*.pkg
          if-no-files-found: error
          retention-days: 30

  # The signed files as published, scanned by Microsoft Defender on current definitions. A clean scan means nothing has to
  # be submitted to Microsoft by hand: reputation follows the signing identity. A detection stops the release here.
  defender-scan:
    name: defender scan (windows)
    needs: seal
    runs-on: windows-latest
    permissions:
      contents: read # check out the scan script
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: packages/native/defender-scan.ps1
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed-windows
          path: out
      - name: Microsoft Defender finds nothing in the signed files
        shell: pwsh
        run: |
          $files = Get-ChildItem out -File | Where-Object { $_.Extension -in '.exe', '.msi', '.tgz' } | ForEach-Object { $_.FullName }
          if (-not $files) { throw "no signed files to scan" }
          ./packages/native/defender-scan.ps1 @files

  release:
    name: draft release
    # The macOS build must pass too. Its signed files join the release once Apple signing is on; until then sign-macos is
    # skipped and the release is the Windows files alone.
    needs: [build, sign-installer, seal, defender-scan, build-macos, sign-macos]
    if: >-
      !cancelled() && github.event_name == 'workflow_dispatch' && inputs.release
      && needs.build.result == 'success' && needs.sign-installer.result == 'success' && needs.seal.result == 'success' && needs.defender-scan.result == 'success' && needs.build-macos.result == 'success'
      && (needs.sign-macos.result == 'success' || needs.sign-macos.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the draft release and upload the signed files to it
    steps:
      # Every signed file, the macOS ones too once Apple signing is on (sign-installer put them with the Windows files).
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed-windows
          path: out
      - name: Create a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          MACOS: ${{ needs.sign-macos.result == 'success' }}
        run: |
          set -euo pipefail
          tag="agent-native-v${VERSION}"
          title="Scopebond Agent ${VERSION} for Windows (signed)"
          notes="The Scopebond Agent and hook as one signed file, the signed Scopebond tray, and the signed installer with both (per user by default; ALLUSERS=1 for every user; the tray starts at sign-in and keeps the agent running), plus the engine bundle with its signed manifest, from which signed installs update their hook without a new installer. Avouro LLC, Azure Artifact Signing, timestamped. Check it: SHA256SUMS, the CycloneDX SBOM, and the build provenance attestation (gh attestation verify scopebond-agent-${VERSION}-x64.exe --repo ${REPO})."
          if [ "$MACOS" = true ]; then
            title="Scopebond Agent ${VERSION} for Windows and macOS (signed)"
            notes="${notes} For macOS, for Apple silicon (arm64) and Intel (x86_64): the installer package scopebond-agent-${VERSION}-<arch>.pkg (/usr/local/bin/scopebond-agent for every user, and a LaunchAgent that starts it at each sign-in; remove it with: sudo \"/Library/Application Support/Scopebond/uninstall.sh\"), and the bare executable scopebond-agent-macos-<arch>.zip, Developer ID signed and notarized (the package stapled). Check them: spctl --assess --type install <pkg>, and gh attestation verify <file> --repo ${REPO}."
          fi
          gh release create "$tag" --repo "$REPO" --target "$SHA" --draft --prerelease --title "$title" --notes "$notes" out/*
