name: Native release (signed)

# The signed single executable (packages/native) and the native tray (packages/tray), built from this public source:
#   build      the executable, the tray and their SBOM from main, with no secrets (any fork can run this job and gets
#              unsigned files)
#   sign       Azure Artifact Signing of the executable and the tray through GitHub's OIDC token, only in the protected
#              `signing` environment (approval required; protected branches only); nothing else runs there
#   installer  the installer built around the signed programs (WiX), with no secrets and no OIDC token
#   sign-installer  the installer signed (the `signing` environment again), then every file verified, summed, the
#              release manifest signed (required) and everything attested
#   sign-macos the Apple build (Developer ID + notarization), designed in and off until its secrets exist
#   release    a draft GitHub release with the signed files, for a person to check and publish
#
# Run by hand from main: Actions → Native release (signed) → Run workflow.
#
# A pull request that touches this workflow, packages/native or packages/tray runs the `build` job alone (no secrets,
# no `signing`): a build or "Check it runs" step that would break the release fails on the pull request instead.

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Create a draft GitHub release with the signed files"
        type: boolean
        default: true
  pull_request:
    paths:
      - .github/workflows/native-release.yml
      - packages/native/**
      - packages/tray/**

permissions: {}

concurrency:
  # One release at a time from main; a pull request's build is its own group, replaced by the next push.
  group: native-release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build (windows)
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      # No dependency cache: a release build starts from the lockfile alone.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.20.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - name: Build the single executable
        run: node packages/native/build-sea.mjs
      - name: Check it runs
        shell: pwsh
        run: |
          $exe = "packages/native/build/scopebond-agent.exe"
          # Read all of the output first: `| Select-Object -First 1` stops the program after one line, and its exit code
          # is then -1 however it ran.
          $out = & $exe hook help
          if ($LASTEXITCODE -ne 0) { throw "the executable did not run (exit $LASTEXITCODE)" }
          $out | Select-Object -First 1
      # The native tray (Rust, Tauri 2), from its committed Cargo.lock, with no cache: a release build starts from the
      # lockfile alone.
      - name: Rust toolchain (packages/tray/rust-toolchain.toml)
        working-directory: packages/tray
        shell: pwsh
        run: |
          rustup toolchain install
          if ($LASTEXITCODE -ne 0) { rustup show }
          rustc --version
      - name: Build the tray
        working-directory: packages/tray
        run: cargo build --release --locked
      - name: Put the tray beside the executable
        shell: pwsh
        run: Copy-Item packages/tray/target/release/scopebond-tray.exe packages/native/build/scopebond-tray.exe
      - name: SBOM
        run: node packages/native/sbom.mjs
      - id: version
        name: Version
        shell: pwsh
        run: |
          $v = (Get-Content packages/agent/package.json | ConvertFrom-Json).version
          "version=$v" >> $env:GITHUB_OUTPUT
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-windows
          path: |
            packages/native/build/scopebond-agent.exe
            packages/native/build/scopebond-tray.exe
            packages/native/build/scopebond-agent.cdx.json
            packages/native/build/sea-main.cjs.map
          if-no-files-found: error
          retention-days: 7

  # Signing the programs: nothing runs here but the download, the Azure sign-in and the signing action. No dependency is
  # installed and no build tool runs in a job that can ask for the signing token.
  sign:
    name: sign (windows)
    needs: build
    # Never from a fork or another branch: the environment allows protected branches only, and this says so too.
    if: github.repository == 'avouro-com/scopebond' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    environment: signing
    permissions:
      contents: read # the build job's artifact
      id-token: write # sign in to Azure (Artifact Signing)
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unsigned-windows
          path: out
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Sign the executable and the tray with Artifact Signing (timestamped)
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          files-folder: out
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: Scopebond Agent
          description-url: https://github.com/avouro-com/scopebond
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-programs
          path: out
          if-no-files-found: error
          retention-days: 7

  # The installer, built around the signed executable and the signed tray, in a job with no secrets and no OIDC token:
  # `dotnet tool restore`, the WiX extension and `wix build` are third-party code, and never run where a signing token
  # can be asked for.
  installer:
    name: installer (windows)
    needs: sign
    runs-on: windows-latest
    permissions:
      contents: read # check out the source the installer is built from
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.20.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed-programs
          path: out
      - name: The programs are signed by Avouro LLC
        shell: pwsh
        run: ./packages/native/verify-signed.ps1 -Folder out
      - name: Build the installer (WiX 5)
        shell: pwsh
        run: |
          node packages/native/build-msi.mjs out/scopebond-agent.exe out/scopebond-tray.exe
          New-Item -ItemType Directory -Force msi | Out-Null
          Move-Item packages/native/build/scopebond-agent-*-x64.msi msi/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-installer
          path: msi
          if-no-files-found: error
          retention-days: 7

  # Signing the installer, then everything a release carries: verified, summed, the signed manifest, winget, attested.
  sign-installer:
    name: sign installer (windows)
    needs: [build, installer]
    if: github.repository == 'avouro-com/scopebond' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    environment: signing
    permissions:
      contents: read # check out the release scripts
      id-token: write # sign in to Azure (Artifact Signing) and sign the provenance attestation
      attestations: write # record the build provenance attestation
    steps:
      # The source, for the release scripts (no dependencies are installed here).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.20.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed-programs
          path: out
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unsigned-installer
          path: msi
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Sign the installer with Artifact Signing (timestamped)
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          files-folder: msi
          files-folder-filter: msi
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: Scopebond Agent
          description-url: https://github.com/avouro-com/scopebond
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true
      - name: Put the installer with the other files, and name the executables by the release's version
        shell: pwsh
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          Move-Item msi/*.msi out/
          Move-Item out/scopebond-agent.exe "out/scopebond-agent-$env:VERSION-x64.exe"
          Move-Item out/scopebond-tray.exe "out/scopebond-tray-$env:VERSION-x64.exe"
      # signtool verify /pa, a valid signature with a timestamp, and the publisher by the updater's own anchored rule.
      - name: Verify every signature, its timestamp and the publisher
        shell: pwsh
        run: ./packages/native/verify-signed.ps1 -Folder out -SignTool
      - name: SHA-256 sums
        shell: pwsh
        run: |
          Push-Location out
          Get-ChildItem -File | Where-Object { $_.Name -ne 'SHA256SUMS' } | Sort-Object Name | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.Name -Algorithm SHA256).Hash.ToLower(), $_.Name
          } | Set-Content -Encoding ascii SHA256SUMS
          Get-Content SHA256SUMS
          Pop-Location
      # The manifest signed installs trust before updating themselves (the updater key, separate from Authenticode).
      # Without the secret the run fails: a release without it is one signed installs would never update to.
      # The manifest names the commit it was built from, so a signed release is bound to one source tree.
      - name: Signed release manifest
        env:
          UPDATER_SIGNING_KEY: ${{ secrets.UPDATER_SIGNING_KEY }}
          VERSION: ${{ needs.build.outputs.version }}
          COMMIT: ${{ github.sha }}
        run: node packages/native/manifest.mjs "$env:VERSION" out "$env:COMMIT"
        shell: pwsh
      # The winget manifests (Avouro.Scopebond) for this release's installer; the owner submits them to winget-pkgs.
      - name: winget manifests
        shell: pwsh
        env:
          VERSION: ${{ needs.build.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          $msi = Get-ChildItem out -Filter "scopebond-agent-$env:VERSION-x64.msi" | Select-Object -First 1
          $wi = New-Object -ComObject WindowsInstaller.Installer
          $db = $wi.GetType().InvokeMember('OpenDatabase', 'InvokeMethod', $null, $wi, @($msi.FullName, 0))
          $view = $db.GetType().InvokeMember('OpenView', 'InvokeMethod', $null, $db, @("SELECT ``Value`` FROM ``Property`` WHERE ``Property``='ProductCode'"))
          $view.GetType().InvokeMember('Execute', 'InvokeMethod', $null, $view, $null) | Out-Null
          $record = $view.GetType().InvokeMember('Fetch', 'InvokeMethod', $null, $view, $null)
          $code = $record.GetType().InvokeMember('StringData', 'GetProperty', $null, $record, 1)
          $sha = (Get-FileHash $msi.FullName -Algorithm SHA256).Hash
          $url = "https://github.com/$env:REPO/releases/download/agent-native-v$env:VERSION/$($msi.Name)"
          node packages/native/winget.mjs $env:VERSION $url $sha $code out
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            out/scopebond-agent-*-x64.exe
            out/scopebond-tray-*-x64.exe
            out/scopebond-agent-*-x64.msi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-windows
          path: out
          if-no-files-found: error
          retention-days: 30

  # The Apple build: a Developer ID signed, hardened-runtime and notarized executable, separate from Artifact Signing.
  # Off until the owner adds the Apple secrets to the `signing-apple` environment and sets APPLE_SIGNING_ENABLED.
  sign-macos:
    name: sign (macos)
    if: github.repository == 'avouro-com/scopebond' && github.ref == 'refs/heads/main' && vars.APPLE_SIGNING_ENABLED == 'true'
    runs-on: macos-latest
    environment: signing-apple
    permissions:
      contents: read # check out the source the installer is built from
      id-token: write # sign in to Azure (Artifact Signing) and sign the provenance attestation
      attestations: write # record the build provenance attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.20.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - name: Build the single executable
        run: node packages/native/build-sea.mjs
      - name: Sign (Developer ID, hardened runtime) and notarize
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
          APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
          APPLE_NOTARY_KEY_ID: ${{ vars.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER: ${{ vars.APPLE_NOTARY_ISSUER }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p "" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "" "$keychain"
          echo "$APPLE_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security list-keychains -d user -s "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$keychain"
          cat > "$RUNNER_TEMP/entitlements.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>com.apple.security.cs.allow-jit</key><true/>
            <key>com.apple.security.cs.allow-unsigned-executable-memory</key><true/>
          </dict></plist>
          PLIST
          exe=packages/native/build/scopebond-agent
          codesign --sign "$APPLE_SIGNING_IDENTITY" --options runtime --timestamp --entitlements "$RUNNER_TEMP/entitlements.plist" "$exe"
          codesign --verify --strict --verbose=2 "$exe"
          ditto -c -k --keepParent "$exe" scopebond-agent-macos.zip
          echo "$APPLE_NOTARY_KEY" > "$RUNNER_TEMP/notary.p8"
          xcrun notarytool submit scopebond-agent-macos.zip --key "$RUNNER_TEMP/notary.p8" --key-id "$APPLE_NOTARY_KEY_ID" --issuer "$APPLE_NOTARY_ISSUER" --wait
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: scopebond-agent-macos.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-macos
          path: scopebond-agent-macos.zip
          if-no-files-found: error
          retention-days: 30

  release:
    name: draft release
    needs: [build, sign-installer]
    if: github.event_name == 'workflow_dispatch' && inputs.release
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the draft release and upload the signed files to it
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed-windows
          path: out
      - name: Create a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          tag="agent-native-v${VERSION}"
          gh release create "$tag" --repo "$REPO" --target "$SHA" --draft --prerelease \
            --title "Scopebond Agent ${VERSION} for Windows (signed)" \
            --notes "The Scopebond Agent and hook as one signed file, the signed Scopebond tray, and the signed installer with both (per user by default; ALLUSERS=1 for every user; the tray starts at sign-in and keeps the agent running). Avouro LLC, Azure Artifact Signing, timestamped. Check it: SHA256SUMS, the CycloneDX SBOM, and the build provenance attestation (gh attestation verify scopebond-agent-${VERSION}-x64.exe --repo ${REPO})." \
            out/*
