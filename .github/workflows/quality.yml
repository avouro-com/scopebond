name: Code quality

# Static checks that sit beside the security audit and CodeQL, each answering a
# question none of those ask:
#
#   eslint    type-aware lint (floating and misused promises, base-to-string,
#             unsafe regular expressions, timing-unsafe comparisons). Results go
#             to code scanning, so they appear in the Security tab with CodeQL's.
#   knip      unused files, exports and dependencies: code and packages nobody
#             calls are still code and packages someone can attack.
#   packages  what consumers actually install: publint checks each package's
#             manifest against its packed files, attw checks its types resolve.
#
# eslint and knip report without failing while their backlog is worked down;
# `packages` is clean today and fails on a regression.

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "45 6 * * 1"
  workflow_dispatch: {}

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  eslint:
    name: eslint (type-aware + security)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write # upload SARIF to code scanning (free on public repos)
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Packages import each other's built declarations; without them every
      # cross-package type is an error type and the type-aware rules misfire.
      - run: pnpm -r build
      - name: eslint (SARIF)
        run: pnpm exec eslint . --format @microsoft/eslint-formatter-sarif --output-file eslint.sarif || true
      - name: eslint (summary)
        run: |
          {
            echo "## eslint"
            echo '```'
            pnpm exec eslint . --format stylish 2>&1 | tail -n 80 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: github/codeql-action/upload-sarif@416ff0dea110f80f0f56f0046500dbf7420e4bb0 # codeql-bundle-v2.27.1
        if: always() && hashFiles('eslint.sarif') != ''
        with:
          sarif_file: eslint.sarif
          category: eslint

  knip:
    name: knip (unused code and dependencies)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: knip (report)
        run: |
          {
            echo "## knip"
            echo '```'
            pnpm exec knip --no-progress --reporter compact 2>&1 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  packages:
    name: packages (publint + attw)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      # Every package that is published (not `"private": true`). The packages are
      # ESM-only by design, so attw checks the ESM resolution modes only.
      - name: publint + attw
        run: |
          status=0
          mkdir -p "$RUNNER_TEMP/packs"
          for dir in packages/*/; do
            [ -f "$dir/package.json" ] || continue
            if node -e "process.exit(require('./${dir}package.json').private ? 0 : 1)"; then continue; fi
            echo "::group::${dir}"
            (cd "$dir" && pnpm exec publint --pack pnpm) || status=1
            tarball=$(cd "$dir" && pnpm pack --pack-destination "$RUNNER_TEMP/packs" | tail -n 1)
            pnpm exec attw "$tarball" --profile esm-only --format table-flipped || status=1
            echo "::endgroup::"
          done
          exit "$status"
