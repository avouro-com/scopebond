name: Dependency review

# Checks the dependencies a pull request *adds or changes* against GitHub's
# advisory database before it merges. osv-scanner in the security audit covers
# the whole tree on a schedule; this catches the new vulnerable package at the
# diff, where it is cheapest to refuse. It also lists each new package's
# OpenSSF Scorecard so an unmaintained dependency is visible in review.

on:
  pull_request:
    branches: [main]

concurrency:
  group: dependency-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependency-review:
    name: dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # Same bar as the osv-scanner gate in the security audit.
          fail-on-severity: high
          show-openssf-scorecard: true
          # The result goes to the run summary; a PR comment would need write access.
          comment-summary-in-pr: never
