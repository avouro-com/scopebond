name: Publish

# Deliberate, manual publish of versioned packages to npm (uses the NPM_TOKEN
# secret). Run from the Actions tab (or `gh workflow run publish.yml`) after the
# versions are bumped (via a changeset + `pnpm version:packages`). Publishes only
# packages whose version isn't already on npm; `examples` is `private` and is never
# published. The normal path is release.yml (publish on merging the Version PR); this
# workflow is the manual fallback. Both publish with npm provenance.

on:
  workflow_dispatch: {}

permissions: {}

# One publish at a time; a second run waits rather than racing the first to the registry.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    name: publish to npm
    runs-on: ubuntu-latest
    # The npm token is read only in this environment's jobs (deployment: false — publishing
    # is not a deployment of this repository).
    environment:
      name: npm
      deployment: false
    permissions:
      contents: read # check out the tagged source
      id-token: write # npm provenance: the registry records which run built each package
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.20.0
          cache: pnpm
          registry-url: "https://registry.npmjs.org"
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - name: Publish (changeset)
        run: pnpm exec changeset publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
