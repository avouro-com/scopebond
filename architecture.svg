<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" role="img" aria-label="Scopebond architecture: a coding agent's action passes through the Scopebond checkpoint, which blocks out-of-policy actions and signs every decision into a receipt anyone can verify offline.">
  <rect width="960" height="360" fill="#1B3A5C"/>
  <style>
    text{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;fill:#F7F4EE}
    .muted{fill:#C9D6E6}.small{font-size:13px}.h{font-size:17px;font-weight:600}
    .box{fill:#14395B;stroke:#3A5B7E;stroke-width:1.5;rx:10}
  </style>
  <!-- agent -->
  <rect class="box" x="30" y="110" width="190" height="140" rx="10"/>
  <text class="h" x="125" y="145" text-anchor="middle">Coding agent</text>
  <text class="small muted" x="125" y="172" text-anchor="middle">Claude Code · Cursor</text>
  <text class="small muted" x="125" y="192" text-anchor="middle">MCP tools · GitHub PR</text>
  <text class="small muted" x="125" y="222" text-anchor="middle">tries an action</text>
  <!-- arrow -->
  <line x1="220" y1="180" x2="300" y2="180" stroke="#D2732F" stroke-width="3"/>
  <polygon points="300,180 288,174 288,186" fill="#D2732F"/>
  <!-- checkpoint -->
  <rect x="300" y="80" width="230" height="200" rx="12" fill="#0F2C47" stroke="#D2732F" stroke-width="2.5"/>
  <text class="h" x="415" y="118" text-anchor="middle">Scopebond checkpoint</text>
  <text class="small muted" x="415" y="146" text-anchor="middle">your policy (JSON)</text>
  <text class="small muted" x="415" y="170" text-anchor="middle">check the action</text>
  <text class="small muted" x="415" y="194" text-anchor="middle">before it runs</text>
  <text class="small muted" x="415" y="230" text-anchor="middle">fail closed · kill switch</text>
  <!-- outcomes -->
  <line x1="530" y1="140" x2="620" y2="140" stroke="#C9D6E6" stroke-width="2.5"/>
  <polygon points="620,140 608,134 608,146" fill="#C9D6E6"/>
  <rect class="box" x="620" y="110" width="150" height="60" rx="10"/>
  <text class="small" x="695" y="138" text-anchor="middle">Allowed</text>
  <text class="small muted" x="695" y="157" text-anchor="middle">runs as usual</text>
  <line x1="530" y1="220" x2="620" y2="220" stroke="#D2732F" stroke-width="2.5"/>
  <polygon points="620,220 608,214 608,226" fill="#D2732F"/>
  <rect x="620" y="190" width="150" height="60" rx="10" fill="#3A1D12" stroke="#D2732F" stroke-width="1.5"/>
  <text class="small" x="695" y="218" text-anchor="middle">Blocked</text>
  <text class="small muted" x="695" y="237" text-anchor="middle">out of policy</text>
  <!-- receipt -->
  <line x1="770" y1="140" x2="820" y2="140" stroke="#C9D6E6" stroke-width="2"/>
  <line x1="770" y1="220" x2="820" y2="220" stroke="#C9D6E6" stroke-width="2"/>
  <line x1="820" y1="140" x2="820" y2="220" stroke="#C9D6E6" stroke-width="2"/>
  <line x1="820" y1="180" x2="852" y2="180" stroke="#C9D6E6" stroke-width="2"/>
  <polygon points="852,180 840,174 840,186" fill="#C9D6E6"/>
  <rect class="box" x="792" y="278" width="140" height="0"/>
  <text class="h" x="880" y="150" text-anchor="middle">Signed</text>
  <text class="h" x="880" y="172" text-anchor="middle">receipt</text>
  <text class="small muted" x="880" y="198" text-anchor="middle">Ed25519</text>
  <text class="small muted" x="880" y="216" text-anchor="middle">verify offline</text>
  <text class="small muted" x="480" y="325" text-anchor="middle">Every decision — allowed or blocked — is signed into a tamper-evident record anyone can verify offline, with no account.</text>
</svg>
